site_name: Enterprise AI Platform Reference Architecture
site_description: Enterprise reference architecture for designing, governing, securing, implementing, and operating AI platforms at scale.
site_url: https://leandrosflora.github.io/enterprise-ai-platform-reference-architecture/
repo_url: https://github.com/leandrosflora/enterprise-ai-platform-reference-architecture
repo_name: leandrosflora/enterprise-ai-platform-reference-architecture
edit_uri: edit/main/docs/

copyright: Enterprise AI Platform Reference Architecture - Leandro Silva Flora

# Keep the repository source layout intact while the MkDocs hook stages Portuguese
# pages as *.pt.md so English can be the default language at the site root.
hooks:
  - scripts/mkdocs_english_default.py

# Keep the original docs directory under live-reload observation because MkDocs
# builds from the temporary i18n staging directory created by the hook above.
watch:
  - docs

# README files are repository landing pages. The documentation site uses index.md
# for the same URLs, so exclude both staged language variants explicitly.
exclude_docs: |
  /README.en.md
  /README.pt.md

# These pages are intentionally reachable through contextual links rather than the
# primary navigation. Declaring them here keeps strict builds useful.
not_in_nav: |
  /domains/*
  /examples/*
  /finops/token-costs.en.md
  /finops/token-costs.pt.md
  /integrations/*
  /reference-architectures/*
  /services/agent-registry.en.md
  /services/agent-registry.pt.md
  /services/audit-service.en.md
  /services/audit-service.pt.md
  /services/billing-service.en.md
  /services/billing-service.pt.md
  /services/mcp-registry.en.md
  /services/mcp-registry.pt.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          site_description: Referência para desenho, governança, implementação e operação de plataformas corporativas de IA
          nav_translations:
            Home: Início
            Overview: Visão geral
            Architecture: Arquitetura
            Principles: Princípios
            Non-functional requirements: Requisitos não funcionais
            Control plane and data plane: Control plane e data plane
            Complete C4 model and publishing: C4 completo e publicação
            Persistent memory: Memória persistente
            Vector and hybrid search: Busca vetorial e híbrida
            Observability: Observabilidade
            Evaluation: Avaliação
            Case studies: Casos aplicados
            AI FinOps: FinOps para IA
            Contracts: Contratos
            Event conventions: Convenções de eventos
            Governance: Governança
            Compliance crosswalk: Crosswalk de compliance
            Approval workflow: Fluxo de aprovação
            AI catalog: Catálogo de IA
            Security: Segurança
            Authentication: Autenticação
            Authorization: Autorização
            RAG and memory security: Segurança de RAG e memória
            Services: Serviços
            Agent onboarding: Onboarding de agente
            MCP onboarding: Onboarding MCP
            Technical roadmap: Roadmap técnico
            Glossary: Glossário
            1. Why an AI Platform?: 1. Por que uma AI Platform?
            5. AI Agent lifecycle: 5. Ciclo de vida de agentes
            6. Document agent case study: 6. Caso de agente documental
            8. Maturity and roadmap: 8. Maturidade e roadmap
            9. Production checklists: 9. Checklists de produção
            MCP and REST: MCP e REST
            Governed agentic SDLC: Agentic SDLC governado
            Intelligent Backoffice — banking dispute: Intelligent Backoffice — contestação bancária
            Multi-skill conversational banking platform: Plataforma conversacional bancária multi-skill
            Tracing and SLOs: Tracing e SLOs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

