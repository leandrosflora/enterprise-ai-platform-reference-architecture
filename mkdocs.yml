site_name: Enterprise AI Platform Reference Architecture
site_description: Referência para desenho, governança, implementação e operação de plataformas corporativas de IA
site_url: https://leandrosflora.github.io/enterprise-ai-platform-reference-architecture/
repo_url: https://github.com/leandrosflora/enterprise-ai-platform-reference-architecture
repo_name: leandrosflora/enterprise-ai-platform-reference-architecture
edit_uri: edit/main/docs/

copyright: Enterprise AI Platform Reference Architecture - Leandro Silva Flora

# These pages are intentionally reachable through contextual links rather than the
# primary navigation. Declaring them here keeps strict builds useful without
# changing the existing Portuguese navigation hierarchy.
not_in_nav: |
  /README.md
  /domains/*
  /examples/*
  /finops/token-costs.md
  /integrations/*
  /reference-architectures/*
  /services/agent-registry.md
  /services/audit-service.md
  /services/billing-service.md
  /services/mcp-registry.md

# README files duplicate the documentation landing page and should not be emitted
# as MkDocs pages. Excluding both localized variants prevents strict-build warnings.
exclude_docs: |
  README.md
  README.en.md

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang:
        - pt
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          name: Português (Brasil)
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: Enterprise reference architecture for designing, governing, securing, implementing, and operating AI platforms at scale.
          nav_translations:
            Início: Home
            Visão geral: Overview
            Arquitetura: Architecture
            Princípios: Principles
            Requisitos não funcionais: Non-functional requirements
            Control plane e data plane: Control plane and data plane
            C4 completo e publicação: Complete C4 model and publishing
            Memória persistente: Persistent memory
            Busca vetorial e híbrida: Vector and hybrid search
            Observabilidade: Observability
            Avaliação: Evaluation
            Casos aplicados: Case studies
            FinOps para IA: AI FinOps
            Contratos: Contracts
            Convenções de eventos: Event conventions
            Governança: Governance
            Fluxo de aprovação: Approval workflow
            Catálogo de IA: AI catalog
            Segurança: Security
            Autenticação: Authentication
            Autorização: Authorization
            Segurança de RAG e memória: RAG and memory security
            Serviços: Services
            Runbooks: Runbooks
            Onboarding de agente: Agent onboarding
            Roadmap técnico: Technical roadmap
            Glossário: Glossary
            1. Por que uma AI Platform?: 1. Why an AI Platform?
            2. Business Outcomes: 2. Business Outcomes
            3. Capability Map: 3. Capability Map
            4. Operating Model: 4. Operating Model
            5. Ciclo de vida de agentes: 5. AI Agent lifecycle
            6. Caso de agente documental: 6. Document agent case study
            7. Decision Guides: 7. Decision Guides
            8. Maturidade e roadmap: 8. Maturity and roadmap
            9. Checklists de produção: 9. Production checklists
            MCP e REST: MCP and REST
            Agentic SDLC governado: Governed agentic SDLC
            Intelligent Backoffice — contestação bancária: Intelligent Backoffice — banking dispute
            Ciclo de vida de agentes: Agent lifecycle
            Caso de agente documental: Document agent case study
            Maturidade e roadmap: Maturity and roadmap
            Checklists de produção: Production checklists
            Plataforma conversacional bancária multi-skill: Multi-skill conversational banking platform
            Tracing e SLOs: Tracing and SLOs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Book:
      - Visão geral: book/index.md
      - 1. Por que uma AI Platform?: book/01-why-ai-platform.md
      - 2. Business Outcomes: book/02-business-outcomes.md
      - 3. Capability Map: book/02-capability-map.md
      - 4. Operating Model: book/03-operating-model.md
      - 5. Ciclo de vida de agentes: book/04-agent-lifecycle.md
      - 6. Caso de agente documental: book/05-case-study-document-agent.md
      - 7. Decision Guides: book/06-decision-guides.md
      - 8. Maturidade e roadmap: book/07-adoption-roadmap.md
      - 9. Checklists de produção: book/08-production-checklists.md
