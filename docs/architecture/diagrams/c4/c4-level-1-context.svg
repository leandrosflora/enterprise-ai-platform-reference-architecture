  <g id="box-user"><rect fill="#FFF3CD" height="145" rx="14" ry="14" stroke="#B7791F" stroke-width="1.5" width="340" x="70" y="90"/><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="240" y="147"><tspan x="240">Cliente / Colaborador</tspan></text><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="240" y="177"><tspan x="240">Consome agentes, copilots e automações</tspan><tspan dy="14.16" x="240">pelos canais corporativos.</tspan></text></g>
  <g id="box-team"><rect fill="#FFF3CD" height="145" rx="14" ry="14" stroke="#B7791F" stroke-width="1.5" width="380" x="570" y="80"/><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="760" y="137"><tspan x="760">Squads e equipe de plataforma</tspan></text><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="760" y="167"><tspan x="760">Desenvolvem, publicam e operam</tspan><tspan dy="14.16" x="760">agentes e capacidades de IA.</tspan></text></g>
  <g id="box-governance"><rect fill="#FFF3CD" height="160" rx="14" ry="14" stroke="#B7791F" stroke-width="1.5" width="430" x="1190" y="75"/><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="1405" y="130"><tspan x="1405">Arquitetura, Segurança,</tspan><tspan dy="18.88" x="1405">Risco, Jurídico e LGPD</tspan></text><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1405" y="178"><tspan x="1405">Definem políticas, aprovam riscos</tspan><tspan dy="14.16" x="1405">e auditam o uso da plataforma.</tspan></text></g>
  <g id="box-channels"><rect fill="#D9EAF7" height="155" rx="14" ry="14" stroke="#4A90C2" stroke-width="1.5" width="360" x="60" y="390"/><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="240" y="452"><tspan x="240">Canais e aplicações digitais</tspan></text><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="240" y="482"><tspan x="240">Web, mobile, WhatsApp, portais internos,</tspan><tspan dy="14.16" x="240">APIs e sistemas consumidores.</tspan></text></g>
  <g id="box-platform"><rect fill="#1168BD" height="205" rx="14" ry="14" stroke="#0B4F8A" stroke-width="2.4" width="440" x="630" y="365"/><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="850" y="451"><tspan x="850">Enterprise AI Platform</tspan></text><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="850" y="488"><tspan x="850">Plataforma corporativa para construir, governar,</tspan><tspan dy="16.52" x="850">executar e observar agentes e soluções de IA.</tspan></text></g>
  <g id="box-corporate"><rect fill="#D9EAF7" height="155" rx="14" ry="14" stroke="#4A90C2" stroke-width="1.5" width="360" x="1280" y="390"/><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1460" y="452"><tspan x="1460">APIs e sistemas corporativos</tspan></text><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1460" y="482"><tspan x="1460">Core systems, CRM, BPM, backoffice,</tspan><tspan dy="14.16" x="1460">documentos e serviços de negócio.</tspan></text></g>
  <g id="box-sources"><rect fill="#E8F5E9" height="155" rx="14" ry="14" stroke="#4C8C4A" stroke-width="1.5" width="390" x="80" y="760"/><text fill="#17351A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="275" y="822"><tspan x="275">Fontes de dados e conhecimento</tspan></text><text fill="#17351A" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="275" y="852"><tspan x="275">Data lake, bancos, documentos</tspan><tspan dy="14.16" x="275">e repositórios corporativos.</tspan></text></g>
  <g id="box-models"><rect fill="#D9EAF7" height="155" rx="14" ry="14" stroke="#4A90C2" stroke-width="1.5" width="300" x="520" y="760"/><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="670" y="822"><tspan x="670">Provedores de modelos</tspan></text><text fill="#102A43" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="670" y="852"><tspan x="670">Foundation models, embeddings</tspan><tspan dy="14.16" x="670">e serviços gerenciados de IA.</tspan></text></g>
  <g id="box-idp"><rect fill="#F3E5F5" height="155" rx="14" ry="14" stroke="#8E5A9A" stroke-width="1.5" width="300" x="870" y="760"/><text fill="#3F2A44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1020" y="822"><tspan x="1020">Identity Provider</tspan></text><text fill="#3F2A44" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1020" y="852"><tspan x="1020">Autenticação de usuários,</tspan><tspan dy="14.16" x="1020">aplicações e workloads.</tspan></text></g>
  <g id="box-human"><rect fill="#FFF3CD" height="155" rx="14" ry="14" stroke="#B7791F" stroke-width="1.5" width="400" x="1220" y="760"/><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1420" y="822"><tspan x="1420">Atendimento e operação humana</tspan></text><text fill="#3D2B00" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" x="1420" y="852"><tspan x="1420">Handoff, aprovação de decisões</tspan><tspan dy="14.16" x="1420">e tratamento de exceções.</tspan></text></g>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle"><text fill="#52606D" x="290" y="316">interage por</text><text fill="#2F6F9F" x="525" y="452">HTTPS / eventos</text><text fill="#7353A3" x="845" y="296">configura e opera</text><text fill="#7353A3" x="1165" y="284">políticas e auditoria</text><text fill="#2F6F9F" x="1175" y="452">APIs / MCP / eventos</text><text fill="#3C7A3F" x="500" y="644">ingestão e retrieval</text><text fill="#2F6F9F" x="760" y="669">inferência e embeddings</text><text fill="#7353A3" x="1020" y="644">OIDC / OAuth 2.0</text><text fill="#7353A3" x="1210" y="654">aprovação / handoff</text></g>
</svg>
