name: Repair English documentation structure

on:
  push:
    branches:
      - fix/english-docs-structure-and-publish
    paths:
      - scripts/repair_english_markdown.py
      - .github/workflows/repair-english-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Repair English Markdown structure
        run: python scripts/repair_english_markdown.py --write

      - name: Validate structural parity
        run: python scripts/repair_english_markdown.py

      - name: Validate documentation integrity
        run: python scripts/validate_docs.py

      - name: Validate English translation coverage
        run: python scripts/validate_docs_i18n.py

      - name: Install MkDocs
        run: |
          pip install --disable-pip-version-check \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.49 \
            mkdocs-static-i18n==1.3.1

      - name: Prepare bilingual publish configuration
        env:
          PUBLISH_ENGLISH_DOCS: 'true'
        run: python scripts/prepare_mkdocs_publish.py

      - name: Build bilingual documentation in strict mode
        run: mkdocs build --clean --strict --config-file mkdocs.publish.yml

      - name: Commit repaired English documentation
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only -- 'docs/*.en.md' 'docs/**/*.en.md')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No English Markdown repairs were necessary"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed_files[@]}"
          git commit -m "fix: restore English Markdown link structure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
