name: Finalize English documentation

on:
  push:
    branches:
      - fix/english-docs-structure-and-publish
    paths:
      - scripts/finalize_english_prose.py
      - .github/workflows/finalize-english-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize English prose
        run: python scripts/finalize_english_prose.py

      - name: Commit normalized English prose
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only -- 'docs/*.en.md' 'docs/**/*.en.md')
          if [ "${#changed_files[@]}" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${changed_files[@]}"
            git commit -m "fix: finalize English documentation prose"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No English prose normalization changes required"
          fi

      - name: Validate translation coverage
        run: python scripts/validate_docs_i18n.py

      - name: Validate Markdown structural parity
        run: python scripts/repair_english_markdown.py

      - name: Validate documentation integrity
        run: python scripts/validate_docs.py

      - name: Install MkDocs
        run: |
          pip install --disable-pip-version-check \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.49 \
            mkdocs-static-i18n==1.3.1

      - name: Prepare bilingual publish configuration
        env:
          PUBLISH_ENGLISH_DOCS: 'true'
        run: python scripts/prepare_mkdocs_publish.py

      - name: Build bilingual documentation in strict mode
        run: mkdocs build --clean --strict --config-file mkdocs.publish.yml
