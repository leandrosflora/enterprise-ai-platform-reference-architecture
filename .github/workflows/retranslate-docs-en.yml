name: Retranslate English documentation

on:
  push:
    branches:
      - fix/english-docs-structure-and-publish
    paths:
      - scripts/retranslate_docs_en.py
      - .github/workflows/retranslate-docs-en.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retranslate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        run: |
          pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          pip install --disable-pip-version-check \
            transformers==4.46.3 \
            sentencepiece \
            sacremoses

      - name: Regenerate 96 English pages
        run: python scripts/retranslate_docs_en.py

      - name: Preserve regenerated English pages
        uses: actions/upload-artifact@v4
        with:
          name: english-docs-editorial-cleanup
          path: |
            docs/*.en.md
            docs/**/*.en.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit regenerated English documentation
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only -- 'docs/*.en.md' 'docs/**/*.en.md')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No English documentation changes found"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed_files[@]}"
          git commit -m "fix: clean English documentation editorially"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate translation coverage
        run: python scripts/validate_docs_i18n.py

      - name: Validate Markdown structural parity
        run: python scripts/repair_english_markdown.py

      - name: Validate documentation integrity
        run: python scripts/validate_docs.py

      - name: Install MkDocs
        run: |
          pip install --disable-pip-version-check \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.49 \
            mkdocs-static-i18n==1.3.1

      - name: Prepare bilingual publish configuration
        env:
          PUBLISH_ENGLISH_DOCS: 'true'
        run: python scripts/prepare_mkdocs_publish.py

      - name: Build bilingual documentation in strict mode
        run: mkdocs build --clean --strict --config-file mkdocs.publish.yml
