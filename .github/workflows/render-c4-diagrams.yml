name: Render C4 diagram PNGs

on:
  push:
    paths:
      - "docs/architecture/diagrams/c4/*.svg"
      - "scripts/render-c4-png.sh"
      - ".github/workflows/render-c4-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-c4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render PNG assets
        run: bash scripts/render-c4-png.sh

      - name: Commit generated PNGs
        run: |
          if [ -z "$(git status --porcelain -- docs/architecture/diagrams/c4)" ]; then
            echo "PNG assets already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/diagrams/c4/*.png
          git commit -m "generate C4 diagram PNGs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
