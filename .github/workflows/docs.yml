name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/validate_docs_i18n.py'
      - 'scripts/prepare_mkdocs_publish.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  # Keep English publishing disabled until the .en.md files are genuine translations.
  # Set to true only after scripts/validate_docs_i18n.py passes in strict mode.
  PUBLISH_ENGLISH_DOCS: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: |
          pip install --disable-pip-version-check \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.49 \
            mkdocs-static-i18n==1.3.1

      - name: Audit translation coverage
        if: env.PUBLISH_ENGLISH_DOCS != 'true'
        run: |
          python scripts/validate_docs_i18n.py || \
            echo "::warning::English documentation is incomplete; English publishing remains disabled."

      - name: Validate translation coverage
        if: env.PUBLISH_ENGLISH_DOCS == 'true'
        run: python scripts/validate_docs_i18n.py

      - name: Prepare publish configuration
        run: python scripts/prepare_mkdocs_publish.py

      - name: Build documentation
        run: mkdocs build --clean --strict --config-file mkdocs.publish.yml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
